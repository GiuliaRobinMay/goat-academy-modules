<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academy Modules · GOAT Academy</title>
  <meta name="description" content="GOAT Academy — Academy Modules member course viewer.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%2316a34a'/><text x='50' y='68' font-size='52' text-anchor='middle'>🐐</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <!-- defines the <wistia-player> element; per-lesson media scripts load
       on demand from app.js (loadWistiaMedia) -->
  <link rel="preconnect" href="https://fast.wistia.com" crossorigin>
  <script src="https://fast.wistia.com/player.js" async></script>
</head>
<body>
  <!-- distinct black top zone; right side stays free for future controls -->
  <header class="appbar">
    <div class="appbar-cover">🐐</div>
    <div class="appbar-info">
      <div class="appbar-row">
        <h1>Academy Modules</h1>
      </div>
    </div>
    <div class="appbar-actions">
      <button class="notes-btn" id="notes-btn" title="View my notes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M9 13h6M9 17h4"/></svg>
        My notes<span class="lh-badge" id="notes-badge" hidden></span>
      </button>
      <button class="settings-btn" id="settings-btn" title="Settings" aria-haspopup="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.65 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01A1.7 1.7 0 0 0 10.05 3V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56h.01a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01c.26.63.87 1.04 1.55 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.03z"/></svg>
      </button>
      <div class="settings-pop" id="settings-pop" hidden>
        <div class="sp-title">Colors</div>
        <button data-theme-choice="green"><span class="swatch g"></span> Green</button>
        <button data-theme-choice="molten"><span class="swatch m"></span> Molten</button>
        <button data-theme-choice="light"><span class="swatch l"></span> ☀ Light</button>
      </div>
    </div>
  </header>

  <main class="main">
    <div id="page"></div>
    <p class="embed-note">
      GOAT Academy · Academy Modules member app — progress &amp; notes are stored on this device
      until the Mighty&nbsp;Networks Headless&nbsp;API sync is connected.
    </p>
  </main>

  <!-- populated on demand by printNotes(); the only thing visible when printing -->
  <div id="print-sheet"></div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
